name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag and package version
        run: test "v$(python -c 'from pathlib import Path; import re; print(re.search(r"__version__ = \"([^\"]+)\"", Path("src/geonodes_ir/__init__.py").read_text()).group(1))')" = "${GITHUB_REF_NAME}"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
